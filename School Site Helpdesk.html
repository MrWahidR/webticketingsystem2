<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>School Site Helpdesk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: petrol side rail with role-aware nav, light work surface. Priority = filled pill, status = dotted chip. */
:root{
  --sans:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --bg:#f2f5f5; --surface:#ffffff; --surface-2:#f6f9f8; --line:#d5dedc; --line-strong:#b4c3c0;
  --ink:#14211f; --muted:#4f605c; --accent:#0c6b67; --accent-ink:#ffffff; --accent-soft:#dcf0ee;
  --side:#12323a; --side-ink:#e1f0ee; --side-muted:#9ac0bd; --side-active:#1f4a54;
  --focus:#1a5fd1; --danger:#b3261e; --danger-soft:#fbe6e4; --warn-soft:#fdf0e1; --ok:#1f7a45; --ok-soft:#e0f2e7;
  --pu-bg:#b3261e; --pu-fg:#ffffff; --ph-bg:#b84f08; --ph-fg:#ffffff; --pm-bg:#f2c94c; --pm-fg:#33290a; --pl-bg:#d6e4f2; --pl-fg:#1c3a57;
  --s-new:#5f7580; --s-assigned:#4a62c9; --s-progress:#0c8a83; --s-hold:#b97a05; --s-done:#2e8b4f; --s-cancelled:#80868a;
  --c-created:#4a62c9; --c-done:#0c8a83; --c-backlog:#14211f; --grid:#dfe7e5;
  --shadow:0 12px 32px rgba(10,30,30,.18);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1514; --surface:#152221; --surface-2:#101b1a; --line:#27393a; --line-strong:#3a5152;
  --ink:#e5efed; --muted:#9db3ae; --accent:#46c7bc; --accent-ink:#06211f; --accent-soft:#12403d;
  --side:#0a1112; --side-ink:#dbebe8; --side-muted:#7fa29e; --side-active:#173033;
  --focus:#7fb0ff; --danger:#ff8d85; --danger-soft:#3a1b1a; --warn-soft:#33240f; --ok:#6fd195; --ok-soft:#163323;
  --pu-bg:#ef6b63; --pu-fg:#2a0907; --ph-bg:#f09a4d; --ph-fg:#2a1405; --pm-bg:#e4c35a; --pm-fg:#2a2100; --pl-bg:#3a5266; --pl-fg:#e3eef7;
  --s-new:#9bb0ba; --s-assigned:#8ea2f0; --s-progress:#4ccdc3; --s-hold:#e3b04a; --s-done:#6fd195; --s-cancelled:#9aa0a4;
  --c-created:#8ea2f0; --c-done:#4ccdc3; --c-backlog:#e5efed; --grid:#243635;
  --shadow:0 12px 32px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1514; --surface:#152221; --surface-2:#101b1a; --line:#27393a; --line-strong:#3a5152;
  --ink:#e5efed; --muted:#9db3ae; --accent:#46c7bc; --accent-ink:#06211f; --accent-soft:#12403d;
  --side:#0a1112; --side-ink:#dbebe8; --side-muted:#7fa29e; --side-active:#173033;
  --focus:#7fb0ff; --danger:#ff8d85; --danger-soft:#3a1b1a; --warn-soft:#33240f; --ok:#6fd195; --ok-soft:#163323;
  --pu-bg:#ef6b63; --pu-fg:#2a0907; --ph-bg:#f09a4d; --ph-fg:#2a1405; --pm-bg:#e4c35a; --pm-fg:#2a2100; --pl-bg:#3a5266; --pl-fg:#e3eef7;
  --s-new:#9bb0ba; --s-assigned:#8ea2f0; --s-progress:#4ccdc3; --s-hold:#e3b04a; --s-done:#6fd195; --s-cancelled:#9aa0a4;
  --c-created:#8ea2f0; --c-done:#4ccdc3; --c-backlog:#e5efed; --grid:#243635;
  --shadow:0 12px 32px rgba(0,0,0,.5); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--side)}
a{color:var(--accent);text-underline-offset:2px}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-weight:650;line-height:1.2;text-wrap:balance}
h1{font-size:1.6rem;letter-spacing:-.01em}
h2{font-size:1.05rem}
h3{font-size:.95rem}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
main:focus{outline:none}
.skip{position:absolute;left:-999px;top:0;background:var(--accent);color:var(--accent-ink);padding:8px 14px;z-index:100;border-radius:0 0 6px 0}
.skip:focus{left:0}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:4px}
.label-caps{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--muted)}

/* shell */
.app{display:grid;grid-template-columns:minmax(0,1fr);min-height:100vh}
.rail{background:var(--side);color:var(--side-ink);position:sticky;top:env(safe-area-inset-top,0px);z-index:20;
  padding-block:10px 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"brand tools" "nav nav";gap:8px 12px;align-items:center}
.brand{grid-area:brand;display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{width:32px;height:32px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.brand-mark svg{width:20px;height:20px}
.brand b{display:block;font-size:1rem;line-height:1.1}
.brand span{display:block;font-size:.78rem;color:var(--side-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
.tools{grid-area:tools;display:flex;align-items:center;gap:8px}
.nav{grid-area:nav;display:flex;gap:4px;overflow-x:auto;padding-bottom:8px;scrollbar-width:thin;margin-inline:-4px;padding-inline:4px}
.nav a{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:8px;color:var(--side-ink);text-decoration:none;white-space:nowrap;font-weight:500;font-size:.92rem}
.nav a svg{width:18px;height:18px;flex:none}
.nav a:hover{background:var(--side-active)}
.nav a[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
.rail :focus-visible{outline-color:#9cc8ff}
.who{display:flex;flex-direction:column;gap:2px}
.who label{font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--side-muted);display:none}
.who select{background:var(--side-active);color:var(--side-ink);border:1px solid #2f5d68;border-radius:8px;padding:6px 8px;max-width:150px;font-size:.85rem}
.bell{position:relative;background:var(--side-active);border:1px solid #2f5d68;color:var(--side-ink);border-radius:8px;width:38px;height:36px;display:grid;place-items:center;cursor:pointer}
.bell svg{width:18px;height:18px}
.bell .dot{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:var(--pu-bg);color:var(--pu-fg);font-size:.7rem;font-weight:700;display:grid;place-items:center}
.main-col{min-width:0;padding-block:18px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.page{max-width:1180px;margin-inline:auto;display:flex;flex-direction:column;gap:18px}
.page.narrow{max-width:680px}
.page-head{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-end;justify-content:space-between}
.page-head .sub{color:var(--muted);margin-top:4px}
.demo-bar{background:var(--accent-soft);color:var(--ink);border-radius:8px;padding:8px 12px;font-size:.85rem;display:flex;gap:8px;flex-wrap:wrap;align-items:center}

@media (min-width:960px){
  .app{grid-template-columns:240px minmax(0,1fr)}
  .rail{position:sticky;top:0;height:100vh;align-self:start;display:flex;flex-direction:column;align-items:stretch;gap:18px;padding-block:20px;overflow-y:auto}
  .nav{flex-direction:column;overflow:visible;margin:0;padding:0}
  .nav a{padding:9px 12px}
  .tools{margin-top:auto;flex-direction:column;align-items:stretch}
  .who label{display:block}
  .who select{max-width:none;width:100%}
  .bell{width:100%}
  .main-col{padding-block:28px 64px}
  .brand span{max-width:150px}
}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:550;min-height:38px;text-decoration:none;line-height:1.2}
.btn:hover{background:var(--surface-2);border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 10px;min-height:32px;font-size:.88rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.input,select.input,textarea.input,.field input[type=text],.field input[type=date],.field input[type=number],.field input:not([type]),.field select,.field textarea,.filters input,.filters select,.cell-sel{
  width:100%;background:var(--surface);color:var(--ink);border:1px solid var(--line-strong);border-radius:8px;padding:8px 10px;min-height:38px}
textarea{resize:vertical;min-height:84px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.field>legend,legend{font-weight:600;font-size:.92rem;padding:0}
fieldset{border:0;margin:0;padding:0;min-width:0}
.opt{font-weight:400;color:var(--muted)}
.hint{font-size:.85rem;color:var(--muted)}
.err{font-size:.85rem;color:var(--danger);font-weight:550}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.check{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.check input{margin-top:4px;width:18px;height:18px;flex:none}
.pri-opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.pri-opt{display:flex;flex-direction:column;gap:4px;border:1px solid var(--line-strong);border-radius:8px;padding:10px;cursor:pointer;background:var(--surface);align-items:flex-start}
.pri-opt:has(input:checked){border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.pri-opt input{position:absolute;opacity:0;pointer-events:none}
.pri-opt:has(input:focus-visible){outline:3px solid var(--focus);outline-offset:2px}
.pri-opt small{color:var(--muted);font-size:.8rem;line-height:1.3}

/* badges */
.pill{display:inline-flex;align-items:center;border-radius:999px;padding:2px 10px;font-size:.78rem;font-weight:650;letter-spacing:.02em;white-space:nowrap}
.p-urgent{background:var(--pu-bg);color:var(--pu-fg)}
.p-high{background:var(--ph-bg);color:var(--ph-fg)}
.p-medium{background:var(--pm-bg);color:var(--pm-fg)}
.p-low{background:var(--pl-bg);color:var(--pl-fg)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);border-radius:999px;padding:1px 10px 1px 8px;font-size:.8rem;font-weight:550;white-space:nowrap;background:var(--surface)}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--dot,var(--s-new))}
.s-new{--dot:var(--s-new)}.s-assigned{--dot:var(--s-assigned)}.s-progress{--dot:var(--s-progress)}.s-hold{--dot:var(--s-hold)}.s-done{--dot:var(--s-done)}.s-cancelled{--dot:var(--s-cancelled)}
.hs{display:inline-flex;align-items:center;gap:4px;font-size:.75rem;font-weight:700;color:var(--danger);border:1px solid var(--danger);border-radius:6px;padding:0 6px;white-space:nowrap}
.av{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--ink);border:1px solid var(--line-strong);font-size:.7rem;font-weight:700;flex:none}
.avs{display:inline-flex;align-items:center}
.avs .av+.av{margin-left:-6px}
.due{font-size:.82rem;color:var(--muted);white-space:nowrap}
.due.over{color:var(--danger);font-weight:650}
.due.soon{color:var(--s-hold);font-weight:600}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.panel-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.grid{display:grid;gap:14px;min-width:0}
.g-tiles{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.g-2{grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr))}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0}
button.tile{cursor:pointer}
button.tile:hover{border-color:var(--accent)}
.tile .k{font-size:.8rem;color:var(--muted);font-weight:600}
.tile .v{font-size:2rem;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.tile.alert .v{color:var(--danger)}
.tile .s{font-size:.78rem;color:var(--muted)}
.banner{border:1px solid var(--danger);background:var(--danger-soft);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.banner b{color:var(--danger)}
.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--line-strong);border-radius:10px;background:var(--surface-2)}

/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{padding:9px 12px;text-align:left;vertical-align:middle;border-bottom:1px solid var(--line)}
tbody tr:last-child td{border-bottom:0}
th{font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:650;background:var(--surface-2);white-space:nowrap}
th button{all:unset;cursor:pointer;display:inline-flex;gap:4px;align-items:center;text-transform:inherit;letter-spacing:inherit}
th button:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
tbody tr:hover{background:var(--surface-2)}
tr.overdue{background:var(--warn-soft)}
tr.overdue:hover{background:var(--warn-soft);filter:brightness(.98)}
td .t-title{font-weight:600;color:var(--ink);text-decoration:none}
a.t-title:hover{text-decoration:underline}
td .t-sub{display:block;color:var(--muted);font-size:.82rem}
.cell-sel{min-height:32px;padding:4px 8px;font-size:.88rem;min-width:150px}
.r{text-align:right}
@media (max-width:759px){.hide-sm{display:none}}

/* filters */
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end}
.filters .field>label{font-size:.78rem;color:var(--muted);font-weight:600}
.flags{display:flex;flex-wrap:wrap;gap:8px}
.flag{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);border-radius:999px;padding:5px 12px;cursor:pointer;background:var(--surface);font-size:.88rem;font-weight:550}
.flag:has(input:checked){background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.flag input{position:absolute;opacity:0;pointer-events:none}
.flag:has(input:focus-visible){outline:3px solid var(--focus);outline-offset:2px}

/* board */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(252px,1fr);gap:12px;overflow-x:auto;padding-bottom:10px;align-items:start}
.kcol{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:140px}
.kcol.over{outline:2px dashed var(--accent);outline-offset:-4px}
.kcol-head{display:flex;justify-content:space-between;align-items:center;padding:2px 2px 4px}
.kcol-head .count{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:7px;cursor:grab}
.kcard.dragging{opacity:.45}
.kcard .top{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.kcard a.t-title{font-weight:600;text-decoration:none;color:var(--ink);line-height:1.3}
.kcard .foot{display:flex;justify-content:space-between;align-items:center;gap:6px}
.kcard select{font-size:.82rem;padding:4px 6px;border:1px solid var(--line-strong);border-radius:6px;background:var(--surface);min-height:30px;width:100%}

/* jobs */
.jobs{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr))}
.job{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:9px;min-width:0}
.job.overdue{background:var(--warn-soft)}
.job h3{font-size:1.02rem}
.job .meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.job .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:2px}
.job p.d{color:var(--muted);font-size:.9rem;overflow-wrap:anywhere}

/* detail */
.detail-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;grid-template-areas:"side" "main"}
.detail-main{grid-area:main;display:flex;flex-direction:column;gap:16px;min-width:0}
.detail-side{grid-area:side;display:flex;flex-direction:column;gap:14px;min-width:0}
@media (min-width:900px){.detail-grid{grid-template-columns:minmax(0,1fr) 320px;grid-template-areas:"main side";align-items:start}}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:.92rem}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.side-block{display:flex;flex-direction:column;gap:8px}
.photos{display:flex;flex-wrap:wrap;gap:8px}
.photos button{padding:0;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden;cursor:zoom-in;background:var(--surface-2);width:104px;height:80px}
.photos img{width:100%;height:100%;object-fit:cover;display:block}
.photo-prev{position:relative}
.photo-prev .rm{position:absolute;top:4px;right:4px;background:var(--surface);border:1px solid var(--line-strong);border-radius:50%;width:24px;height:24px;cursor:pointer;line-height:1;font-weight:700}
.timeline{display:flex;flex-direction:column;gap:10px;list-style:none;margin:0;padding:0}
.tl-log{display:flex;gap:10px;align-items:baseline;font-size:.88rem;color:var(--muted)}
.tl-log::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--line-strong);flex:none;transform:translateY(-1px)}
.tl-log time,.tl-c time{font-size:.8rem;white-space:nowrap}
.tl-c{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface-2);display:flex;flex-direction:column;gap:4px}
.tl-c.internal{background:var(--warn-soft);border-style:dashed}
.tl-c header{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;font-size:.86rem}
.tl-c p{white-space:pre-wrap;overflow-wrap:anywhere}

/* bars + charts */
.bars{display:flex;flex-direction:column;gap:9px}
.bar-row{display:grid;grid-template-columns:minmax(100px,38%) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:.9rem}
.bar-row .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track{height:12px;border-radius:6px;background:var(--grid);display:flex;overflow:hidden}
.track i{display:block;height:100%}
.seg-assigned{background:var(--s-assigned)}.seg-progress{background:var(--s-progress)}.seg-hold{background:var(--s-hold)}.seg-new{background:var(--s-new)}
.seg-acc{background:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.82rem;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;background:var(--lc)}
.chart{width:100%;min-height:240px}
.chart svg{display:block;max-width:100%}
.chart text{font-family:var(--sans);font-size:11px;fill:var(--muted)}
.chart .gridline{stroke:var(--grid);stroke-width:1}
.chart .axis{stroke:var(--line-strong);stroke-width:1}
.b-created{fill:var(--c-created)}.b-done{fill:var(--c-done)}
.l-backlog{fill:none;stroke:var(--c-backlog);stroke-width:2}

function seedState() {
  const now = NOW();

  const rnd = (a, b) => a + (b - a) * R();
  const pick = a => a[Math.floor(R() * a.length)];
  const st = {

  const workTime = daysAgo => {

      created: o.created, due: o.created + st.pri[o.pri].hours * H, assignees: o.asg || [], assignedAt: o.assignedAt || null,

function setAssignees(t, ids) {
  const prev = t.assignees.slice(); ids = Array.from(new Set(ids));

  t.assignees = ids;
  if (!ids.length) {

    if (t.status === 'assigned' || t.status === 'progress') { t.status = 'new'; addLog(t, 'Status changed to New'); }
    return;

  if (t.status === 'new') t.status = 'assigned';
  addLog(t, (prev.length ? 'Reassigned to ' : 'Assigned to ') + names);
  notify(ids.filter(i => !prev.includes(i)), 'You have been assigned ' + ref(t) + ': ' + t.title, t.id);
  notify([t.req], 'Your ticket ' + ref(t) + ' has been assigned to ' + names, t.id);
}
function changeStatus(t, to, o = {}) {
  const from = t.status; if (from === to) return { ok: true };
  const actor = me();
  if ((to === 'assigned' || to === 'progress') && !t.assignees.length) {
    if (actor.role === 'caretaker') setAssignees(t, [actor.id]); else return { error: 'Assign someone to this ticket first.' };
  }
  if (to === 'hold' && !(o.reason || '').trim()) return { error: 'Add a reason for putting this on hold.' };
  const wasClosed = !OPEN.includes(from);
  t.status = to;
  if (to !== 'hold') t.holdReason = '';
  if (wasClosed && OPEN.includes(to)) { t.closed = null; t.completedBy = null; addLog(t, 'Reopened'); }
  const mg = mgrIds();
  if (to === 'new') {
    if (t.assignees.length) { addLog(t, 'Unassigned (was ' + t.assignees.map(uname).join(', ') + ')'); t.assignees = []; }
    addLog(t, 'Status changed to New');
  } else if (to === 'assigned') {
    addLog(t, 'Status changed to Assigned');
  } else if (to === 'progress') {
    if (!t.startedAt) t.startedAt = NOW();
    addLog(t, from === 'hold' ? 'Work resumed' : 'Status changed to In progress');
    notify([t.req], 'Work has started on ' + ref(t) + ': ' + t.title, t.id);
  } else if (to === 'hold') {
    t.holdReason = o.reason.trim();

  } else if (to === 'done') {

  } else if (to === 'cancelled') {
    t.closed = NOW(); addLog(t, 'Ticket cancelled');
    notify([...mg, ...t.assignees], ref(t) + ' was cancelled: ' + t.title, t.id);
  }
  return { ok: true };
}

  notify([...(internal ? [] : [t.req]), ...t.assignees, ...mgrIds()], 'New comment on ' + ref(t) + ' from ' + uname(S.meId) + ': ' + text.trim().slice(0, 80), t.id);

/* ============ Photos ============ */
function readPhoto(file) {
  return new Promise((res, rej) => {
    if (!/^image\//.test(file.type)) return rej(new Error('That file is not an image.'));
    const fr = new FileReader();
    fr.onerror = () => rej(new Error('Could not read that file.'));
    fr.onload = () => {
      const im = new Image();
      im.onerror = () => rej(new Error('Could not open that image.'));
      im.onload = () => {
        const M = 1000; const sc = Math.min(1, M / Math.max(im.width, im.height));
        const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(im.width * sc)); c.height = Math.max(1, Math.round(im.height * sc));
        c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', 0.72));
      };
      im.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

function suggestPriority(title, desc, cat, hs) {
  const text = (title + ' ' + desc).toLowerCase();
  let m;
  if (hs) return ['urgent', 'You flagged a safety concern'];
  if ((m = text.match(/flood|gas leak|smell of gas|smoke|fire|sparks|exposed wire|shock|broken glass|glass|asbestos|unsafe|dangerous|intruder|locked in|burst|collapse|injur|slippery/))) return ['urgent', 'Mentions "' + m[0] + '"'];
  if ((m = text.match(/leak|no heating|no hot water|cold|toilet|flush|blocked|not working|broken|will not|won't|wont|stuck|no power|power cut|dead|wifi|wi-fi|internet|latch|lock|trip hazard/))) return ['high', 'Mentions "' + m[0] + '"'];
  if (cat === 'Health & Safety') return ['high', 'Health and safety category'];
  if (cat === 'Install/Assembly' || /shelf|shelves|put up|hang|paint|label|move|assemble/.test(text)) return ['low', 'Looks like planned work'];
  return ['medium', 'Standard repair'];
}

/* ============ All tickets ============ */
function filterTickets(f) {
  return S.tickets.filter(t => {
    if (f.status === 'open') { if (!isOpen(t)) return false; } else if (f.status !== 'all' && t.status !== f.status) return false;
    if (f.pri && t.pri !== f.pri) return false;
    if (f.cat && t.cat !== f.cat) return false;
    if (f.bld && t.building !== f.bld) return false;
    if (f.asg === 'none') { if (t.assignees.length) return false; } else if (f.asg && !t.assignees.includes(f.asg)) return false;
    if (f.from && t.created < new Date(f.from + 'T00:00:00').getTime()) return false;
    if (f.to && t.created > new Date(f.to + 'T23:59:59').getTime()) return false;
    if (f.overdue && !isOverdue(t)) return false;
    if (f.q) {
      const hay = (ref(t) + ' ' + t.title + ' ' + t.desc + ' ' + t.building + ' ' + t.room + ' ' + t.cat + ' ' + uname(t.req) + ' ' + t.assignees.map(uname).join(' ')).toLowerCase();
      if (!hay.includes(f.q.toLowerCase())) return false;
    }
    return true;
  });
}
function assignCell(t) {
  if (isMgr() && isOpen(t) && t.assignees.length <= 1) {
    return `<select class="cell-sel" data-chg="assign" data-id="${t.id}" aria-label="Assign ${ref(t)}"><option value="">Unassigned</option>${techs().map(u => `<option value="${u.id}" ${t.assignees[0] === u.id ? 'selected' : ''}>${esc(u.name)}</option>`).join('')}</select>`;
  }
  return avatars(t.assignees) + (isMgr() && isOpen(t) ? ` <button class="btn sm ghost" data-act="assign" data-id="${t.id}">Edit</button>` : '');
}
function ticketsResults() {
  const f = UI.f.tickets, s = UI.sort.tickets, rows = filterTickets(f);
  const cmp = {
    ref: (a, b) => a.id - b.id, title: (a, b) => a.title.localeCompare(b.title), pri: byUrgency,
    status: (a, b) => STATUSES.findIndex(x => x.k === a.status) - STATUSES.findIndex(x => x.k === b.status) || a.due - b.due,
    asg: (a, b) => (a.assignees[0] ? uname(a.assignees[0]) : '~').localeCompare(b.assignees[0] ? uname(b.assignees[0]) : '~'),
    due: (a, b) => a.due - b.due, created: (a, b) => a.created - b.created
  }[s.k];
  rows.sort((a, b) => cmp(a, b) * s.dir);
  const th = (k, l, cls) => `<th class="${cls || ''}" aria-sort="${s.k === k ? (s.dir > 0 ? 'ascending' : 'descending') : 'none'}"><button data-act="sort" data-k="${k}">${l}<span aria-hidden="true">${s.k === k ? (s.dir > 0 ? ' ▲' : ' ▼') : ''}</span></button></th>`;
  return `<p class="small muted" role="status" style="margin-bottom:8px">Showing ${rows.length} of ${S.tickets.length} tickets</p>` + (rows.length ? `<div class="tbl-wrap"><table><thead><tr>${th('ref', 'Ref')}${th('title', 'Ticket')}${th('pri', 'Priority')}${th('status', 'Status')}${th('asg', 'Assigned to')}${th('due', 'Due')}${th('created', 'Created', 'hide-sm')}</tr></thead><tbody>${rows.map(t => `<tr class="${isOverdue(t) ? 'overdue' : ''}"><td class="mono">${ref(t)}</td><td><a class="t-title" href="#ticket-${t.id}">${esc(t.title)}</a> ${hsFlag(t)}<span class="t-sub">${esc(loc(t))} · ${esc(t.cat)}</span></td><td>${priPill(t.pri)}</td><td>${statusChip(t.status)}${t.status === 'hold' ? `<span class="t-sub">${esc(t.holdReason)}</span>` : ''}</td><td>${assignCell(t)}</td><td>${dueCell(t)}</td><td class="hide-sm due">${fmtDate(t.created)}</td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">No tickets match these filters.</div>');
}
const optList = (arr, sel, blank) => (blank != null ? `<option value="">${esc(blank)}</option>` : '') + arr.map(x => { const v = Array.isArray(x) ? x[0] : x, l = Array.isArray(x) ? x[1] : x; return `<option value="${esc(v)}" ${v === sel ? 'selected' : ''}>${esc(l)}</option>`; }).join('');

function csvCell(v) {
  let s = v == null ? '' : String(v); if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;
  return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
const isoDT = ts => { if (!ts) return ''; const d = new Date(ts); return dayKey(ts) + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes()); };
function ticketsCsv(list) {
  const head = ['Ref', 'Title', 'Description', 'Category', 'Building', 'Room', 'Priority', 'Status', 'Hold reason', 'Reported by', 'Assigned to', 'Created', 'Due', 'Assigned at', 'Closed', 'Hours to assign', 'Hours to close', 'Within target', 'H&S concern'];
  const hrs = ms => ms == null ? '' : (Math.round(ms / H * 10) / 10);
  const rows = list.map(t => [ref(t), t.title, t.desc, t.cat, t.building, t.room, S.pri[t.pri].label, SL[t.status], t.holdReason, uname(t.req), t.assignees.map(uname).join('; '), isoDT(t.created), isoDT(t.due), isoDT(t.assignedAt), isoDT(t.closed), t.assignedAt ? hrs(t.assignedAt - t.created) : '', t.closed ? hrs(t.closed - t.created) : '', t.status === 'done' ? (slaMet(t) ? 'Yes' : 'No') : '', t.hs ? 'Yes' : 'No']);
  return '﻿' + [head, ...rows].map(r => r.map(csvCell).join(',')).join('\r\n');
}
async function download(filename, data) {
  if (!UI.dl) { toast('Downloads are not available in this view. Open the page on claude.ai to export files.', 'warn'); return; }
  try { await UI.dl.save({ filename, data }); toast('Saved ' + filename); }
  catch (e) { if (e && e.code === 'declined') return; toast('Could not save the file.', 'warn'); }
}

/* ============ Dialog flows ============ */
function assignDlg(t, then) {
  const cur = new Set(t.assignees);
  modal('Assign ' + ref(t), `<p class="muted small">${esc(t.title)}</p><div class="pick">${techs().map(u => { const n = S.tickets.filter(x => isOpen(x) && x.assignees.includes(u.id)).length; return `<label><input type="checkbox" name="u" value="${u.id}" ${cur.has(u.id) ? 'checked' : ''}><span><b>${esc(u.name)}</b> <span class="muted small">${esc(u.title)} · ${n} open</span></span></label>`; }).join('')}</div>`, {
    submit: 'Save',
    onSubmit: fd => {
      const ids = fd.getAll('u');
      if (then && !ids.length) return { error: 'Choose at least one person.' };
      setAssignees(t, ids);
      if (then) { const r = changeStatus(t, then); if (r.error) return r; }
      commit(ids.length ? 'Assigned to ' + ids.map(uname).join(', ') : 'Ticket unassigned');
    }
  });
}
function holdDlg(t) {

    submit: 'Put on hold',

}
function completeDlg(t) {
  modal('Complete ' + ref(t), `<p class="muted small">${esc(t.title)}</p><div class="field"><label for="c-note">Completion note <span class="opt">(optional)</span></label><textarea id="c-note" name="note" maxlength="500" placeholder="What was done? Anything the requester should know?"></textarea></div>`, {
    submit: 'Mark complete',
    onSubmit: fd => { const r = changeStatus(t, 'done', { note: fd.get('note') || '' }); if (r.error) return r; commit('Marked as completed'); }
  });
}
function cancelDlg(t) {
  modal('Cancel ' + ref(t), `<p>This will close the ticket. You can ask the site manager to reopen it later.</p><div class="field"><label for="x-note">Reason <span class="opt">(optional)</span></label><textarea id="x-note" name="note" maxlength="300"></textarea></div>`, {

  });
}
function reopenDlg(t) {
  modal('Reopen ' + ref(t), `<div class="field"><label for="o-note">What is still wrong?</label><textarea id="o-note" name="note" maxlength="500"></textarea></div>`, {
    submit: 'Reopen',
    onSubmit: fd => {
      const note = (fd.get('note') || '').trim(); if (!note) return { error: 'Say what still needs doing.' };
      const r = changeStatus(t, t.assignees.length ? 'assigned' : 'new'); if (r.error) return r;
      addComment(t, note, false); notify([...mgrIds(), ...t.assignees], ref(t) + ' was reopened: ' + t.title, t.id);
      commit('Ticket reopened');
    }
  });
}
function moveTicket(id, to) {
  const t = ticketById(id); if (!t || t.status === to) return;
  if (to === 'hold') { render(true); return holdDlg(t); }
  if (to === 'done') { render(true); return completeDlg(t); }
  if (to === 'cancelled') { render(true); return cancelDlg(t); }
  if ((to === 'assigned' || to === 'progress') && !t.assignees.length && me().role !== 'caretaker') { render(true); return assignDlg(t, to); }
  const r = changeStatus(t, to); if (r.error) { render(true); return toast(r.error, 'warn'); }
  commit('Status changed to ' + SL[to]);
}

const FORMS = {
  new(form) {
    const title = form.title.value.trim(), b = form.building.value, rm = form.room.value;
    $('#nt-title-err').textContent = ''; $('#nt-loc-err').textContent = ''; $('#nt-err').textContent = '';
    let bad = false;
    if (title.length < 3) { $('#nt-title-err').textContent = 'Say briefly what needs doing (at least 3 characters).'; bad = true; }
    if (!b || !rm) { $('#nt-loc-err').textContent = 'Choose the building and the room or area.'; bad = true; }
    if (bad) { (title.length < 3 ? form.title : (!b ? form.building : form.room)).focus(); return; }
    const t = createTicket({ title, desc: form.desc.value, cat: form.cat.value, building: b, room: rm, pri: form.pri.value || 'medium', hs: form.hs.checked, photos: UI.draft.photos, assignee: form.assignee ? form.assignee.value : '' });
    UI.draft = { photos: [], picked: false };
    save(); toast('Ticket ' + ref(t) + ' sent' + (t.hs ? '. The site manager has been alerted.' : '.'));
    location.hash = 'ticket-' + t.id;
  },
  comment(form) {
    const text = form.text.value.trim(); const t = ticketById(+form.dataset.id);
    if (!t) return; if (!text) { $('#c-err').textContent = 'Write a comment first.'; form.text.focus(); return; }
    addComment(t, text, form.internal ? form.internal.checked : false); commit('Comment added');
  },
  addUser(form) {
    const name = form.name.value.trim(); if (name.length < 2) { $('#u-err').textContent = 'Enter the person\'s name.'; return; }
    const u = { id: 'u' + uid(), name, title: form.title.value.trim(), role: form.role.value, active: true };
    S.users.push(u); audit('Added ' + name + ' as ' + ROLES[u.role]); commit(name + ' added');
  },
  addCat(form) {
    const n = form.name.value.trim(); if (!n) return;
    if (S.cats.some(c => c.toLowerCase() === n.toLowerCase())) return toast('That category already exists.', 'warn');
    S.cats.push(n); audit('Added category ' + n); commit('Category added');
  },
  addBuilding(form) {
    const n = form.name.value.trim(); if (!n) return;
    if (S.buildings.some(b => b.name.toLowerCase() === n.toLowerCase())) return toast('That building already exists.', 'warn');
    S.buildings.push({ name: n, rooms: [] }); audit('Added building ' + n); commit('Building added');
  },
  addRoom(form) {
    const b = S.buildings[+form.dataset.b], n = form.name.value.trim(); if (!b || !n) return;
    if (b.rooms.some(r => r.toLowerCase() === n.toLowerCase())) return toast('That room already exists.', 'warn');
    b.rooms.push(n); audit('Added room ' + n + ' to ' + b.name); commit('Room added');
  },
  sla(form) {
    const vals = {}; for (const p of PRI) { const v = Math.round(+form['h-' + p].value); if (!(v >= 1 && v <= 2000)) { $('#sla-err').textContent = 'Enter a number of hours from 1 to 2000 for every priority.'; return; } vals[p] = v; }
    PRI.forEach(p => { S.pri[p].hours = vals[p]; }); audit('Changed priority targets: ' + PRI.map(p => S.pri[p].label + ' ' + vals[p] + 'h').join(', ')); commit('Targets saved');
  },
  settings(form) {
    const ret = Math.round(+form.ret.value); if (!(ret >= 1 && ret <= 120)) { $('#set-err').textContent = 'Retention must be between 1 and 120 months.'; return; }
    const terms = S.settings.terms.map((t, i) => ({ name: t.name, start: form['ts' + i].value, end: form['te' + i].value }));
    if (terms.some(t => !t.start || !t.end || t.end < t.start)) { $('#set-err').textContent = 'Check the term dates: each term needs a start and an end that is not before it.'; return; }
    S.settings.school = form.school.value.trim() || 'Your School'; S.settings.retentionMonths = ret; S.settings.terms = terms; audit('Updated school settings'); commit('Settings saved');
  }
};

/* ============ Events ============ */
const ACT = {
  bell() { UI.notifOpen = !UI.notifOpen; chrome(route()); },
  notifAll() { S.notifs.forEach(n => { if (n.to === S.meId) n.read = true; }); save(); chrome(route()); },
  notifRead(el) { const n = S.notifs.find(x => x.id === el.dataset.id); if (n) n.read = true; UI.notifOpen = false; save(); chrome(route()); },
  dismissDemo() { S.settings.demo = false; commit(); },
  tile(el) {
    const g = el.dataset.go, f = UI.f.tickets;
    Object.assign(f, { q: '', status: 'open', pri: '', cat: '', bld: '', asg: '', from: '', to: '', overdue: false });
    if (g === 'done') return go('done');
    if (g === 'overdue') f.overdue = true; if (g === 'urgent') f.pri = 'urgent'; if (g === 'needs') f.status = 'new';
    go('tickets');
  },
  sort(el) {
    const s = UI.sort.tickets, k = el.dataset.k; if (s.k === k) s.dir *= -1; else { s.k = k; s.dir = 1; }
    refreshResults(); const b = $('[data-act="sort"][data-k="' + k + '"]'); if (b) b.focus();
  },
  clearFilters() { UI.f.tickets = { q: '', status: 'open', pri: '', cat: '', bld: '', asg: '', from: '', to: '', overdue: false }; render(true); },
  exportTickets() { download('helpdesk-tickets-' + dayKey(NOW()) + '.csv', ticketsCsv(filterTickets(UI.f.tickets))); },
  exportDone() { download('helpdesk-completed-' + dayKey(NOW()) + '.csv', ticketsCsv(doneList())); },
  exportReportCsv() { const R = reportData(UI.f.reports.range); download('helpdesk-report-' + dayKey(NOW()) + '.csv', ticketsCsv(R.created)); },
  exportReportHtml() { download('helpdesk-report-' + dayKey(NOW()) + '.html', reportHtml(reportData(UI.f.reports.range))); },
  assign(el) { const t = ticketById(+el.dataset.id); if (t) assignDlg(t); },
  start(el) { const t = ticketById(+el.dataset.id); if (!t) return; const r = changeStatus(t, 'progress'); if (r.error) return toast(r.error, 'warn'); commit(t.status === 'progress' ? 'Work started' : ''); },
  hold(el) { const t = ticketById(+el.dataset.id); if (t) holdDlg(t); },
  complete(el) { const t = ticketById(+el.dataset.id); if (t) completeDlg(t); },
  cancel(el) { const t = ticketById(+el.dataset.id); if (t) cancelDlg(t); },
  reopen(el) { const t = ticketById(+el.dataset.id); if (t) reopenDlg(t); },
  fillReason(el) { const i = $('#h-reason'); if (i) { i.value = el.dataset.v; i.focus(); } },
  photo(el) {
    const t = ticketById(+el.dataset.id); if (!t) return; const p = t.photos.filter(safeImg)[+el.dataset.i]; if (!p) return;
    modal('Photo for ' + ref(t), `<img class="dlg-img" src="${p}" alt="Photo attached to ${esc(t.title)}">`, { noSubmit: true });
  },
  rmDraftPhoto(el) { UI.draft.photos.splice(+el.dataset.i, 1); photoPreview(); },
  copyDigest() {
    const text = digestText();
    const fallback = () => { const pre = $('pre'); if (pre) { const r = document.createRange(); r.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(r); } toast('Text selected. Press Ctrl+C or Cmd+C to copy.'); };
    try { navigator.clipboard.writeText(text).then(() => toast('Digest copied'), fallback); } catch (e) { fallback(); }
  },
  adminTab(el) { UI.adminTab = el.dataset.tab; render(true); const b = $('#tab-' + UI.adminTab); if (b) b.focus(); },
  toggleUser(el) {
    const u = user(el.dataset.id); if (!u) return;
    if (u.active && u.role === 'manager' && mgrIds().length <= 1) return toast('There must be at least one active site manager.', 'warn');
    u.active = !u.active; audit((u.active ? 'Activated ' : 'Deactivated ') + u.name); commit();
  },
  rmCat(el) { const c = S.cats[+el.dataset.i]; if (c == null || S.tickets.some(t => t.cat === c)) return; S.cats.splice(+el.dataset.i, 1); audit('Removed category ' + c); commit('Category removed'); },
  rmRoom(el) { const b = S.buildings[+el.dataset.b]; if (!b) return; const r = b.rooms.splice(+el.dataset.i, 1)[0]; audit('Removed room ' + r + ' from ' + b.name); commit('Room removed'); },
  rmBuilding(el) {
    const b = S.buildings[+el.dataset.i]; if (!b) return;
    confirmDlg('Remove ' + b.name + '?', 'Its rooms will no longer be offered on new tickets. Existing tickets keep their location.', 'Remove building', () => { S.buildings.splice(S.buildings.indexOf(b), 1); audit('Removed building ' + b.name); commit('Building removed'); }, true);
  },
  purge() {
    const cutoff = NOW() - S.settings.retentionMonths * 30.44 * D, n = S.tickets.filter(t => !isOpen(t) && t.closed && t.closed < cutoff).length;
    confirmDlg('Delete ' + n + ' old ticket' + (n === 1 ? '' : 's') + '?', 'This permanently removes closed tickets older than ' + S.settings.retentionMonths + ' months. It cannot be undone.', 'Delete tickets', () => { S.tickets = S.tickets.filter(t => isOpen(t) || !t.closed || t.closed >= cutoff); audit('Deleted ' + n + ' closed tickets older than ' + S.settings.retentionMonths + ' months'); commit('Old tickets deleted'); }, true);
  },
  startFresh() {
    confirmDlg('Start with an empty helpdesk?', 'All tickets and notifications are removed. People, places and targets stay. This cannot be undone.', 'Remove all tickets', () => { S.tickets = []; S.notifs = []; S.nextId = 1; S.settings.demo = false; audit('Cleared all tickets to start fresh'); commit('The helpdesk is now empty'); }, true);
  },
  resetDemo() {
    confirmDlg('Restore the sample data?', 'This replaces everything in this browser with the original sample tickets and people.', 'Restore sample data', () => { S = seedState(); S.digestDate = ''; runDaily(); save(); location.hash = homeFor(me().role); render(); toast('Sample data restored'); }, true);
  }
};
const CHG = {
  me(el) { S.meId = el.value; UI.notifOpen = false; save(); const h = homeFor(me().role); if (location.hash === '#' + h) render(); else location.hash = h; },
  assign(el) {
    const t = ticketById(+el.dataset.id); if (!t) return; if (!el.value && t.status === 'new') return;
    setAssignees(t, el.value ? [el.value] : []); commit(el.value ? ref(t) + ' assigned to ' + uname(el.value) : ref(t) + ' unassigned');
  },
  move(el) { moveTicket(+el.dataset.id, el.value); },
  status(el) { moveTicket(+el.dataset.id, el.value); },
  pri(el) { const t = ticketById(+el.dataset.id); if (t) { setPriority(t, el.value); commit('Priority changed to ' + S.pri[el.value].label); } },
  due(el) { const t = ticketById(+el.dataset.id); if (t && el.value) { setDue(t, el.value); commit('Due date changed'); } },
  role(el) {
    const u = user(el.dataset.id); if (!u) return;
    if (u.role === 'manager' && el.value !== 'manager' && u.active && mgrIds().length <= 1) { el.value = u.role; return toast('There must be at least one active site manager.', 'warn'); }
    audit('Changed ' + u.name + ' from ' + ROLES[u.role] + ' to ' + ROLES[el.value]); u.role = el.value; commit('Role updated');
  },
  range(el) { UI.f.reports.range = el.value; render(true); },
  ntBld(el) { $('#nt-room').innerHTML = roomOptions(el.value, ''); },
  ntPri() { UI.draft.picked = true; updateSuggestion(); },
  async draftPhoto(el) {
    const files = Array.from(el.files || []); el.value = '';
    for (const f of files) {
      if (UI.draft.photos.length >= 4) { toast('You can attach up to 4 photos.', 'warn'); break; }
      try { UI.draft.photos.push(await readPhoto(f)); } catch (e) { toast(e.message, 'warn'); }
    }
    photoPreview();
  },
  async addPhoto(el) {
    const t = ticketById(+el.dataset.id); const files = Array.from(el.files || []); el.value = ''; if (!t) return;
    let n = 0;
    for (const f of files) {
      if (t.photos.length >= 8) { toast('A ticket can have up to 8 photos.', 'warn'); break; }
      try { t.photos.push(await readPhoto(f)); n++; } catch (e) { toast(e.message, 'warn'); }
    }
    if (n) { addLog(t, 'Added ' + n + ' photo' + (n > 1 ? 's' : '')); commit(n + ' photo' + (n > 1 ? 's' : '') + ' added'); }
  }
};
function applyFilter(el) {
  const ns = el.dataset.fs, k = el.dataset.fk; if (!ns || !UI.f[ns]) return;
  UI.f[ns][k] = el.type === 'checkbox' ? el.checked : el.value; refreshResults();
}
document.addEventListener('click', e => {
  if (e.target.closest('[data-close]')) { $('#dlg').close(); return; }
  if (e.target === $('#dlg')) { $('#dlg').close(); return; }
  const el = e.target.closest('[data-act]');
  if (UI.notifOpen && !e.target.closest('.notif-panel') && !(el && el.dataset.act === 'bell')) { UI.notifOpen = false; chrome(route()); }
  if (!el) return;
  const fn = ACT[el.dataset.act]; if (fn) fn(el, e);
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.fs) { if (el.type === 'search' || el.type === 'text') return; return applyFilter(el); }
  if (el.dataset.nt) updateSuggestion();
  const fn = el.dataset.chg && CHG[el.dataset.chg]; if (fn) fn(el, e);
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.fs && (el.type === 'search' || el.type === 'text')) applyFilter(el);
  if (el.dataset.nt) updateSuggestion();
});
document.addEventListener('submit', e => {
  const f = e.target.closest('form[data-form]'); if (!f) return;
  e.preventDefault(); const fn = FORMS[f.dataset.form]; if (fn) fn(f);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && UI.notifOpen) { UI.notifOpen = false; chrome(route()); const b = $('.bell'); if (b) b.focus(); } });
/* Board drag and drop */
let dragId = null;
document.addEventListener('dragstart', e => { const c = e.target.closest && e.target.closest('.kcard'); if (!c) return; dragId = +c.dataset.id; e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', String(dragId)); } catch (x) { /* ignore */ } c.classList.add('dragging'); });
document.addEventListener('dragend', e => { const c = e.target.closest && e.target.closest('.kcard'); if (c) c.classList.remove('dragging'); $$('.kcol.over').forEach(x => x.classList.remove('over')); });
document.addEventListener('dragover', e => { const c = e.target.closest && e.target.closest('.kcol'); if (c && dragId != null) { e.preventDefault(); $$('.kcol.over').forEach(x => { if (x !== c) x.classList.remove('over'); }); c.classList.add('over'); } });
document.addEventListener('drop', e => { const c = e.target.closest && e.target.closest('.kcol'); if (!c || dragId == null) return; e.preventDefault(); const id = dragId; dragId = null; c.classList.remove('over'); moveTicket(id, c.dataset.col); });

/* ============ Boot ============ */
function afterRender() { if (route().name === 'new') { photoPreview(); } }
window.addEventListener('hashchange', () => { if (route().name === 'new' && UI.lastRoute !== 'new') UI.draft = { photos: [], picked: false }; render(); afterRender(); });
(function boot() {
  S = loadState(); if (!S) { S = seedState(); S.digestDate = ''; save(); }
  if (!user(S.meId)) S.meId = S.users[0].id;
  $('#dlg').addEventListener('click', e => { if (e.target === $('#dlg')) $('#dlg').close(); });
  runDaily();
  try { if (window.claude && window.claude.use) window.claude.use('downloads').then(d => { UI.dl = d; }).catch(() => { }); } catch (e) { /* no capability */ }
  render(); afterRender();
})();
</script>

</body></html>
